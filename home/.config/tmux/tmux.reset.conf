# ============================================================================
# tmux.reset.conf - Essential tmux keybindings
# ============================================================================

# First remove *all* keybindings (commented out to keep defaults)
# unbind-key -a

# Core session management keybindings
bind ^X lock-server                    # Ctrl+Space then Ctrl+X: Lock the tmux server
bind ^C new-window -c "$HOME"          # Ctrl+Space then Ctrl+C: Create new window in home directory
bind ^D detach                         # Ctrl+Space then Ctrl+D: Detach from current session
bind * list-clients                    # Prefix then *: List all connected clients

# Window navigation shortcuts
bind H previous-window                 # Prefix then H: Go to previous window
bind L next-window                     # Prefix then L: Go to next window

# Window and session utilities
bind r command-prompt "rename-window %%"  # Prefix then r: Rename current window
bind R source-file ~/.config/tmux/tmux.conf  # Prefix then R: Reload tmux configuration
bind S choose-session                  # Prefix then S: Show session selector

# Enable vim-style visual selection in copy mode
bind-key -T copy-mode-vi v send-keys -X begin-selection  # 'v' to start visual selection
