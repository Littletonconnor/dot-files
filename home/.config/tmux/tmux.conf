# ============================================================================
# tmux.conf - Minimal tmux configuration
# ============================================================================

# Load essential keybindings
source-file ~/.config/tmux/tmux.reset.conf

# ============================================================================
# TERMINAL SETTINGS
# ============================================================================

# Enable 256 color support for better syntax highlighting
set-option -g default-terminal 'screen-256color'

# Enable true color (24-bit) support for modern terminals
set-option -g terminal-overrides ',xterm-256color:RGB'

# ============================================================================
# PREFIX KEY
# ============================================================================

# Unbind default prefix (Ctrl+b)
unbind C-b

# Set prefix to Ctrl+Space (more ergonomic than Ctrl+b)
set -g prefix C-Space

# Allow Ctrl+Space to be sent to applications by pressing it twice
bind C-Space send-prefix

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Enable mouse support for clicking, scrolling, and resizing panes
set -g mouse on

# Increase scrollback history from default 2,000 lines to 1 million
set -g history-limit 1000000

# Remove delay when pressing Esc (important for Vim/Neovim)
set -g escape-time 0

# Automatically renumber windows when one is closed (keeps them sequential)
set -g renumber-windows on

# Enable system clipboard integration (works with pbcopy on macOS)
set -g set-clipboard on

# ============================================================================
# WINDOW AND PANE INDEXING
# ============================================================================

# Start pane numbering at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# ============================================================================
# PANE SPLITTING
# ============================================================================

# Split vertically with | (creates side-by-side panes)
bind | split-window -h -c "#{pane_current_path}"

# Split horizontally with - (creates top/bottom panes)
bind - split-window -v -c "#{pane_current_path}"

# ============================================================================
# PANE NAVIGATION (Vim-style)
# ============================================================================

# Navigate panes using h,j,k,l (same as Vim/Neovim)
bind h select-pane -L  # Move to left pane
bind j select-pane -D  # Move to pane below
bind k select-pane -U  # Move to pane above
bind l select-pane -R  # Move to right pane

# ============================================================================
# PANE RESIZING
# ============================================================================

# Resize pane up by 10 lines
bind-key + resize-pane -U 10

# Resize pane down by 10 lines (using underscore since - is for splitting)
bind-key _ resize-pane -D 10

# Resize pane left by 10 columns
bind-key < resize-pane -L 10

# Resize pane right by 10 columns
bind-key > resize-pane -R 10

# Toggle pane zoom (maximize/restore)
bind Z resize-pane -Z

# ============================================================================
# COPY MODE (Vi-style)
# ============================================================================

# Use vi key bindings in copy mode
set-window-option -g mode-keys vi

# Enter copy mode with prefix + [
# Navigate with h,j,k,l
# Start selection with 'v'
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Toggle rectangular selection with Ctrl+v
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy selection to system clipboard with 'y' (uses pbcopy on macOS)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'

# Mouse selection should copy to clipboard and stay in copy mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe 'pbcopy'

# ============================================================================
# THEME & PLUGINS
# ============================================================================

# Plugin manager (install with: git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm)
set -g @plugin 'tmux-plugins/tpm'

# Better defaults and sensible options
set -g @plugin 'tmux-plugins/tmux-sensible'

# Seamless navigation between vim and tmux panes
set -g @plugin 'christoomey/vim-tmux-navigator'

# Enhanced yank (copy) functionality
set -g @plugin 'tmux-plugins/tmux-yank'

# Catppuccin theme for tmux
set -g @plugin 'catppuccin/tmux'

# ============================================================================
# CATPPUCCIN THEME CONFIGURATION
# ============================================================================

# Set the flavor to Mocha (matches your Ghostty and Neovim theme)
set -g @catppuccin_flavor 'mocha'

# Status bar customization
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

# Window status styling
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

# Status modules (what appears in the status bar)
set -g @catppuccin_status_modules_right ""
set -g @catppuccin_status_modules_left "session"

# Status bar separators
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# Directory display (show only current directory name, not full path)
set -g @catppuccin_directory_text "#{b:pane_current_path}"

# Date/time format
set -g @catppuccin_date_time_text "%H:%M"

# Initialize plugin manager (keep this at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
