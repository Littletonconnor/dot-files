# ============================================================================
# TMUX Configuration - Base + Catppuccin Mocha
# ============================================================================

# ----------------------------------------------------------------------------
# Terminal & Display Settings
# ----------------------------------------------------------------------------
set-option -g default-terminal 'screen-256color'
set-option -g terminal-overrides ',xterm-256color:RGB'
set -g mouse on

# ----------------------------------------------------------------------------
# Prefix Key
# ----------------------------------------------------------------------------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ----------------------------------------------------------------------------
# Base Settings
# ----------------------------------------------------------------------------
set -g history-limit 1000000     # increase history size
set -g escape-time 0             # zero-out escape time delay
set -g renumber-windows on       # renumber all windows when any window is closed
set -g set-clipboard on          # use system clipboard
set -g status-position bottom    # status bar at bottom (default)
set -g base-index 1              # start windows at 1, not 0
set -g pane-base-index 1         # start panes at 1, not 0
set-window-option -g pane-base-index 1
set-window-option -g mode-keys vi

# ----------------------------------------------------------------------------
# Key Bindings - Vim Style Navigation
# ----------------------------------------------------------------------------
# Pane selection (with prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane selection (without prefix - Alt+arrow)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Window switching (Shift+arrow)
bind -n S-Left previous-window
bind -n S-Right next-window

# Window switching (Alt+vim keys)
bind -n M-H previous-window
bind -n M-L next-window

# Split windows with current path
bind % split-window -v -c "#{pane_current_path}"
bind '"' split-window -h -c "#{pane_current_path}"

# Reload config
bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Rename window
bind r command-prompt "rename-window %%"

# Copy mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ----------------------------------------------------------------------------
# Plugins
# ----------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# ----------------------------------------------------------------------------
# Catppuccin Mocha Colors (Minimal)
# ----------------------------------------------------------------------------
# Status bar
set -g status-style bg=#1e1e2e,fg=#cdd6f4

# Active window
set -g window-status-current-style bg=#89b4fa,fg=#1e1e2e

# Inactive windows
set -g window-status-style bg=#313244,fg=#cdd6f4

# Pane borders
set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#89b4fa

# Messages
set -g message-style bg=#89b4fa,fg=#1e1e2e

# ----------------------------------------------------------------------------
# Initialize TPM (keep at bottom)
# ----------------------------------------------------------------------------
run '~/.tmux/plugins/tpm/tpm'
